<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地方競馬予想 2026/08/25</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #0f1420; --bg2: #161d2e; --card: #1b2437; --border: #2a3550;
  --fg: #e8ecf5; --fg2: #a8b3c9; --fg3: #6b7690;
  --gold: #d4af5a; --gold2: #f0d896; --accent: #4a9eff;
  --chip-bg: #24304a; --ok: #4caf7d; --pending: #6b7690;
}
@media (prefers-color-scheme: light) {
  :root:not([data-force-dark]) {
    --bg: #f5f3ee; --bg2: #ffffff; --card: #ffffff; --border: #e0dccf;
    --fg: #1c1c1c; --fg2: #52504a; --fg3: #8a877c;
    --gold: #9c7a1f; --gold2: #6b5614; --accent: #1a6fd6;
    --chip-bg: #f0ede3; --ok: #2f8f5b; --pending: #a09c8e;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  line-height: 1.45; display: flex; flex-direction: column; overflow: hidden;
}
header {
  padding: 10px 12px 0;
  background: linear-gradient(180deg, var(--bg2), var(--bg));
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
header .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
header h1 { margin: 0; font-size: 1.05rem; color: var(--gold2); }
header .top-right { display: flex; align-items: center; gap: 8px; }
header .updated { font-size: 0.68rem; color: var(--fg3); }
.refresh-btn {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--chip-bg); color: var(--fg2);
  font-size: 0.95rem; line-height: 1; cursor: pointer; display: flex;
  align-items: center; justify-content: center; padding: 0;
}
.refresh-btn:active { transform: scale(0.92); }
.refresh-btn.spinning { animation: spin 0.7s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

.health-warn {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px; margin-bottom: 8px;
  background: #4a2a1a; border: 1px solid #a05a2c; border-radius: 6px;
  color: #f0c8a0; font-size: 0.78rem;
}
@media (prefers-color-scheme: light) {
  :root:not([data-force-dark]) .health-warn { background: #fbe9dc; border-color: #d98a3f; color: #7a4413; }
}

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 0 0 auto; padding: 6px 14px; border-radius: 16px 16px 0 0;
  background: var(--bg); border: 1px solid var(--border); border-bottom: none;
  color: var(--fg2); font-size: 0.88rem; cursor: pointer;
}
.tab-btn.active { background: var(--card); color: var(--gold2); font-weight: 700; }
.win-mark { margin-left: 3px; }

.races-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }
.race-chip {
  flex: 0 0 auto; min-width: 2.4em; text-align: center; padding: 6px 2px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--chip-bg);
  color: var(--fg2); font-size: 0.85rem; cursor: pointer; position: relative;
}
.race-chip .dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--pending); margin-left: 3px; vertical-align: middle;
}
.race-chip.confirmed .dot { background: var(--ok); }
.race-chip.active { border-color: var(--gold); color: var(--gold2); font-weight: 700; }
.race-chip .manken-star { display: block; font-size: 0.62em; color: var(--gold); line-height: 1.3; letter-spacing: -1px; }

main { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px 24px; max-width: 640px; margin: 0 auto; width: 100%; }
.empty { color: var(--fg3); font-size: 1.05rem; text-align: center; padding: 60px 20px; }

.race-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.race-head {
  display: flex; align-items: baseline; gap: 10px; padding: 10px 14px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
}
.race-no { font-weight: 700; font-size: 1.3rem; color: var(--gold2); }
.race-n { font-size: 0.85rem; color: var(--fg3); }
.post-time { font-size: 0.85rem; color: var(--fg2); margin-left: auto; }
.status-badge { font-size: 0.75rem; padding: 3px 9px; border-radius: 10px; }
.status-badge.pending { background: var(--chip-bg); color: var(--fg3); }
.status-badge.confirmed { background: var(--ok); color: #fff; }

.horses { padding: 6px 12px; }
.horse-row {
  display: grid; grid-template-columns: 1.6em 1.9em 1fr 2.6em; gap: 5px;
  align-items: center; padding: 7px 0; font-size: 1.18rem; border-bottom: 1px dashed var(--border);
}
.horse-row:last-child { border-bottom: none; }
.sym { color: var(--gold); font-weight: 700; text-align: center; }
.hno { color: var(--fg2); text-align: right; }
.hname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.score { color: var(--fg3); font-size: 0.7em; text-align: right; font-variant-numeric: tabular-nums; }

.bets { padding: 8px 14px 12px; border-top: 1px solid var(--border); }
.bet-row { margin-top: 6px; }
.bet-row.no-bet { color: var(--fg3); font-size: 0.95rem; text-align: center; padding: 6px 0; }
.bet-type { display: block; font-size: 0.85rem; color: var(--fg3); margin-bottom: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  background: var(--chip-bg); border: 1px solid var(--border); border-radius: 20px;
  padding: 6px 12px; font-size: 1.02rem; color: var(--fg2); white-space: nowrap;
}
.chip b { color: var(--accent); }

.bet-row-emphasized {
  background: color-mix(in srgb, var(--ok) 10%, transparent);
  border: 1px solid var(--ok); border-radius: 8px; padding: 8px 10px; margin-top: 8px;
}
.bet-row-emphasized .bet-type { color: var(--ok); font-weight: 700; }
.bet-row-emphasized .chip { border-color: var(--ok); font-size: 1.1rem; font-weight: 600; }
.tan-badge {
  display: inline-block; margin-left: 6px; font-size: 0.68rem; font-weight: 400;
  background: var(--ok); color: #fff; padding: 2px 7px; border-radius: 10px; vertical-align: middle;
}

.retrigger-row { padding: 8px 14px; border-bottom: 1px solid var(--border); }
.retrigger-btn {
  width: 100%; padding: 9px; border-radius: 8px; border: 1px solid var(--accent);
  background: transparent; color: var(--accent); font-size: 0.95rem; font-weight: 700;
  cursor: pointer;
}
.retrigger-btn:disabled { opacity: 0.6; cursor: default; }

.manken-box { padding: 10px 14px; border-top: 1px solid var(--border); background: var(--bg2); }
.manken-box h3 { margin: 0 0 8px; font-size: 0.82rem; color: var(--gold); display: flex; align-items: center; gap: 6px; }
.manken-box .stars { color: var(--gold); letter-spacing: 1px; }
.manken-cand { font-size: 0.92rem; color: var(--fg2); padding: 3px 0; }
.manken-reason { font-size: 0.78rem; color: var(--fg3); margin-top: 6px; }
.manken-skip { font-size: 0.85rem; color: var(--fg3); padding: 2px 0; }

.result-box { padding: 10px 14px; border-top: 1px solid var(--border); background: var(--bg2); }
.result-box h3 { margin: 0 0 6px; font-size: 0.82rem; color: var(--ok); }
.finish-list { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.finish-item { font-size: 0.85rem; color: var(--fg2); }
.finish-item .pos { color: var(--gold); font-weight: 700; margin-right: 3px; }
.payout-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.payout-chip {
  background: var(--card); border: 1px solid var(--ok); border-radius: 20px;
  padding: 4px 10px; font-size: 0.82rem; color: var(--fg2);
}
.payout-chip b { color: var(--ok); }

footer { text-align: center; color: var(--fg3); font-size: 0.7rem; padding: 10px; flex: 0 0 auto; }
</style>
</head>

const WORKER_URL = 'https://chihou-trigger.peykyo.workers.dev';

function reloadPage() {
  // ホーム画面ショートカットで開くと（chromeless表示のため）ブラウザのリロードUIが
  // 無いことがあり、手動更新の手段が無くなる。ボタンから明示的にリロードさせる。
  // キャッシュされた古いHTMLが返らないよう、URLにタイムスタンプを付けて強制リロードする。
  const btn = document.getElementById('page-refresh-btn');
  if (btn) btn.classList.add('spinning');
  const url = new URL(location.href);
  url.searchParams.set('_r', Date.now());
  location.href = url.toString();
}
let curVenue = DATA.venues.length ? DATA.venues[0].key : null;
let curRace  = null;
let triggerCooldownUntil = 0;

async function requestReupdate(raceNo) {
  const btn = document.getElementById('retrigger-btn');
  if (!btn || Date.now() < triggerCooldownUntil) return;
  btn.disabled = true;
  btn.textContent = '送信中...';
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({venue: curVenue, race_no: raceNo})
    });
    if (res.ok) {
      const data = await res.json().catch(() => ({}));
      triggerCooldownUntil = Date.now() + 90000;
      if (data && data.token_warning) {
        btn.textContent = `⚠️ 送信済み（GitHubトークンが残り${data.token_warning.days_left}日で失効します）`;
      } else {
        btn.textContent = '✅ 送信しました（1〜2分後に更新）';
      }
      setTimeout(() => {
        const b = document.getElementById('retrigger-btn');
        if (b) { b.disabled = false; b.textContent = '🔄 最新オッズで再予想'; }
      }, 90000);
    } else {
      btn.textContent = '⚠️ 送信失敗（後でもう一度）';
      btn.disabled = false;
    }
  } catch (e) {
    btn.textContent = '⚠️ 通信エラー（後でもう一度）';
    btn.disabled = false;
  }
}

function pickInitialRace(venue) {
  // 未確定の最初のレース（＝これから買うべきレース）を初期選択にする
  const unconfirmed = venue.races.find(r => !r.confirmed);
  return unconfirmed ? unconfirmed.no : (venue.races[0] ? venue.races[0].no : null);
}

function renderHealthWarning() {
  const el = document.getElementById('health-warn');
  if (!el) return;
  const h = DATA.health;
  if (h && h.ok === false && (h.errors || []).length) {
    el.innerHTML = `<div class="health-warn">⚠️ 前回の自動更新で一部失敗しました: ${h.errors.slice(0, 2).join(' / ')}</div>`;
  } else {
    el.innerHTML = '';
  }
}

function render() {
  renderHealthWarning();
  const main = document.getElementById('main');
  if (!DATA.venues.length) {
    main.innerHTML = '<p class="empty">🏇 本日は対応競馬場の開催がありません</p>';
    document.getElementById('tabs').innerHTML = '';
    document.getElementById('races').innerHTML = '';
    return;
  }
  const venue = DATA.venues.find(v => v.key === curVenue) || DATA.venues[0];
  curVenue = venue.key;
  if (curRace === null) curRace = pickInitialRace(venue);

  // 競馬場タブ（バックテストで3連単ROIが安定して良かった場に🎯マーク。買い目ロジックは
  // 変えていない、あくまで購入判断の参考表示）
  const winSet = new Set(DATA.winning_venues || []);
  document.getElementById('tabs').innerHTML = DATA.venues.map(v => {
    const winMark = winSet.has(v.key) ? '<span class="win-mark">🎯</span>' : '';
    return `<button class="tab-btn ${v.key === curVenue ? 'active' : ''}" onclick="selectVenue('${v.key}')">${v.label}${winMark}</button>`;
  }).join('');

  // レースチップ（万馬券予想で★が付いていれば荒れそうなレースとして表示）
  document.getElementById('races').innerHTML = venue.races.map(r => {
    const mk = r.manken;
    const starHtml = (mk && !mk.skipped && mk.stars > 0) ? `<span class="manken-star">${'★'.repeat(mk.stars)}</span>` : '';
    return `<div class="race-chip ${r.confirmed ? 'confirmed' : ''} ${r.no === curRace ? 'active' : ''}" onclick="selectRace(${r.no})">
       ${r.no}R<span class="dot"></span>${starHtml}
     </div>`;
  }).join('');

  const race = venue.races.find(r => r.no === curRace);
  if (!race) { main.innerHTML = '<p class="empty">レースを選んでください</p>'; return; }

  const horseRows = race.horses.map(h => `
    <div class="horse-row">
      <span class="sym">${h.sym}</span>
      <span class="hno">${h.horse_no}</span>
      <span class="hname">${h.horse_name}</span>
      <span class="score">${h.score.toFixed(2)}</span>
    </div>`).join('');

  let betHtml = '';
  const isWinVenue = winSet.has(curVenue);
  let betTypes = Object.keys(race.bets || {});
  if (isWinVenue) {
    // 🎯場では3連単を先頭に出して目立たせる（買い目自体・順序以外のロジックは不変）
    betTypes = betTypes.sort((a, b) => (a === '3連単' ? -1 : b === '3連単' ? 1 : 0));
  }
  if (betTypes.length) {
    betHtml = betTypes.map(bt => {
      const chips = race.bets[bt].map(it => `<span class="chip">${it.combo} <b>${it.amount.toLocaleString()}円</b></span>`).join('');
      const emphasize = isWinVenue && bt === '3連単';
      const badge = emphasize ? '<span class="tan-badge">🎯的中実績が良い場</span>' : '';
      return `<div class="bet-row ${emphasize ? 'bet-row-emphasized' : ''}"><span class="bet-type">${bt}${badge}</span><div class="chips">${chips}</div></div>`;
    }).join('');
  } else {
    betHtml = '<div class="bet-row no-bet">見送り（期待値基準を満たす買い目なし）</div>';
  }

  let mankenHtml = '';
  if (race.manken) {
    if (race.manken.skipped) {
      mankenHtml = `
        <div class="manken-box">
          <h3>⚡ 万馬券予想</h3>
          <div class="manken-skip">見送り（${race.manken.skip_reason || '条件不足'}）</div>
        </div>`;
    } else if (race.manken.stars > 0) {
      const candHtml = (race.manken.candidates || []).map(c => `<div class="manken-cand">${c}</div>`).join('');
      const reasonHtml = (race.manken.reasons || []).join(' / ');
      mankenHtml = `
        <div class="manken-box">
          <h3>⚡ 万馬券予想 <span class="stars">${'★'.repeat(race.manken.stars)}</span></h3>
          ${candHtml}
          ${reasonHtml ? `<div class="manken-reason">${reasonHtml}</div>` : ''}
        </div>`;
    }
  }

  let resultHtml = '';
  if (race.confirmed) {
    const finishHtml = (race.top3 || []).map(t =>
      `<span class="finish-item"><span class="pos">${t.finish_pos}着</span>${t.horse_no}番 ${t.horse_name}</span>`
    ).join('');
    const payoutTypes = Object.keys(race.payouts || {});
    const payoutHtml = payoutTypes.map(bt => {
      const p = race.payouts[bt];
      return `<span class="payout-chip">${bt} ${p.combo} <b>${p.payout ? p.payout.toLocaleString() + '円' : '-'}</b></span>`;
    }).join('');
    resultHtml = `
      <div class="result-box">
        <h3>結果</h3>
        <div class="finish-list">${finishHtml || '<span class="finish-item">着順情報なし</span>'}</div>
        <div class="payout-chips">${payoutHtml}</div>
      </div>`;
  }

  const retriggerHtml = race.confirmed ? '' : `
      <div class="retrigger-row">
        <button id="retrigger-btn" class="retrigger-btn" onclick="requestReupdate(${race.no})">🔄 最新オッズで再予想</button>
      </div>`;

  main.innerHTML = `
    <section class="race-card">
      <div class="race-head">
        <span class="race-no">${race.no}R</span>
        <span class="race-n">${race.n_horses}頭</span>
        ${race.post_time ? `<span class="post-time">発走 ${race.post_time}</span>` : ''}
        <span class="status-badge ${race.confirmed ? 'confirmed' : 'pending'}">${race.confirmed ? '確定' : '未確定'}</span>
      </div>
      ${retriggerHtml}
      <div class="horses">${horseRows}</div>
      <div class="bets">${betHtml}</div>
      ${mankenHtml}
      ${resultHtml}
    </section>`;
}

function selectVenue(key) { curVenue = key; curRace = null; render(); }
function selectRace(no) { curRace = no; render(); }

render();
</script>
