<style>
:root {
  color-scheme: light dark;
  --bg: #0f1420; --bg2: #161d2e; --card: #1b2437; --border: #2a3550;
  --fg: #f5f7fb; --fg2: #c7d0e2; --fg3: #98a3bd;
  --gold: #e0bb68; --gold2: #f5e0a3; --accent: #6cadff;
  --chip-bg: #29354e; --ok: #5cbf8d; --pending: #7f8bab;
}
@media (prefers-color-scheme: light) {
  :root:not([data-force-dark]) {
    --bg: #f5f3ee; --bg2: #ffffff; --card: #ffffff; --border: #e0dccf;
    --fg: #161512; --fg2: #38362f; --fg3: #5c594f;
    --gold: #8a6a18; --gold2: #5c4a10; --accent: #0f5cc2;
    --chip-bg: #eeeae0; --ok: #226e46; --pending: #8a8677;
  }
}
/* 2026-09-06追加: 「文字が見えづらい」との指摘を受け、基準フォントサイズを上げ、
   薄い文字色（fg2/fg3）を全体的に濃く（コントラスト強く）した。上のカラー変数の
   変更と合わせて対応。 */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  font-size: 18px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden;
}
header {
  padding: 10px 12px 0;
  background: linear-gradient(180deg, var(--bg2), var(--bg));
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
header .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
header h1 { margin: 0; font-size: 1.15rem; color: var(--gold2); }
header .top-right { display: flex; align-items: center; gap: 8px; }
header .updated { font-size: 0.8rem; color: var(--fg3); }
.refresh-btn {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--chip-bg); color: var(--fg2);
  font-size: 0.95rem; line-height: 1; cursor: pointer; display: flex;
  align-items: center; justify-content: center; padding: 0;
}
.refresh-btn:active { transform: scale(0.92); }
.refresh-btn.spinning { animation: spin 0.7s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

.health-warn {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px; margin-bottom: 8px;
  background: #4a2a1a; border: 1px solid #a05a2c; border-radius: 6px;
  color: #f0c8a0; font-size: 0.78rem;
}
@media (prefers-color-scheme: light) {
  :root:not([data-force-dark]) .health-warn { background: #fbe9dc; border-color: #d98a3f; color: #7a4413; }
}

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 0 0 auto; padding: 7px 15px; border-radius: 16px 16px 0 0;
  background: var(--bg); border: 1px solid var(--border); border-bottom: none;
  color: var(--fg2); font-size: 0.95rem; cursor: pointer;
}
.tab-btn.active { background: var(--card); color: var(--gold2); font-weight: 700; }
.win-mark { margin-left: 3px; }

.day-toggle { display: flex; gap: 6px; margin-top: 6px; }
.day-btn {
  flex: 0 0 auto; padding: 6px 13px; border-radius: 14px;
  background: var(--chip-bg); border: 1px solid var(--border);
  color: var(--fg2); font-size: 0.88rem; font-weight: 600; cursor: pointer;
}
.day-btn.active { background: var(--gold); border-color: var(--gold); color: #1c1c1c; font-weight: 700; }

.races-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }
.race-chip {
  flex: 0 0 auto; min-width: 2.4em; text-align: center; padding: 6px 2px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--chip-bg);
  color: var(--fg2); font-size: 0.92rem; font-weight: 600; cursor: pointer; position: relative;
}
.race-chip .dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--pending); margin-left: 3px; vertical-align: middle;
}
.race-chip.confirmed .dot { background: var(--ok); }
.race-chip.active { border-color: var(--gold); color: var(--gold2); font-weight: 700; }
.race-chip .manken-star { display: block; font-size: 0.72em; color: var(--gold); line-height: 1.3; letter-spacing: -1px; }

main { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px 24px; max-width: 640px; margin: 0 auto; width: 100%; }
.empty { color: var(--fg2); font-size: 1.15rem; text-align: center; padding: 60px 20px; }

.race-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.race-head {
  display: flex; align-items: baseline; gap: 10px; padding: 10px 14px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
}
.race-no { font-weight: 700; font-size: 1.4rem; color: var(--gold2); }
.race-n { font-size: 0.92rem; color: var(--fg2); }
.post-time { font-size: 0.92rem; color: var(--fg2); margin-left: auto; }
.status-badge { font-size: 0.85rem; font-weight: 600; padding: 3px 10px; border-radius: 10px; }
.status-badge.pending { background: var(--chip-bg); color: var(--fg2); }
.status-badge.confirmed { background: var(--ok); color: #fff; }

.horses { padding: 6px 12px; }
.horse-row {
  /* 2026-09-06修正: 列幅はem（.horse-row自身の大きくしたfont-sizeに連動）だと
     馬名以外の列まで一緒に太って馬名の表示スペースを圧迫してしまっていた
     （「馬の名前が省略されすぎる」の原因）。rem固定にして列幅は元の見た目の
     広さのまま、列内の文字サイズ（各列内でのem指定）だけ大きくなるようにする。 */
  display: grid; grid-template-columns: 1.7rem 2rem 1fr 3.8rem 2.7rem; gap: 6px;
  align-items: center; padding: 8px 0; font-size: 1.3rem; border-bottom: 1px dashed var(--border);

.horse-row:last-child { border-bottom: none; }
.sym-cell { display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
.sym { color: var(--gold); font-weight: 700; text-align: center; }
.morning-sym { font-size: 0.65em; color: var(--fg2); font-weight: 600; white-space: nowrap; }
.hno { color: var(--fg2); font-weight: 700; text-align: right; }
.hname { display: flex; flex-direction: column; overflow: hidden; line-height: 1.3; }
.hname-main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 1rem; }
.jockey { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.62em; color: var(--fg3); font-weight: 500; }
.odds-pop { font-size: 0.68em; color: var(--fg2); font-weight: 600; text-align: right; line-height: 1.35; font-variant-numeric: tabular-nums; }
.odds-pop .pop { display: block; }
.score { color: var(--fg2); font-size: 0.75em; text-align: right; font-variant-numeric: tabular-nums; }

.bets { padding: 8px 14px 12px; border-top: 1px solid var(--border); }
.bet-row { margin-top: 6px; }
.bet-row.no-bet { color: var(--fg2); font-size: 1rem; text-align: center; padding: 6px 0; }
.bet-type { display: block; font-size: 0.92rem; font-weight: 600; color: var(--fg2); margin-bottom: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  background: var(--chip-bg); border: 1px solid var(--border); border-radius: 20px;
  padding: 7px 13px; font-size: 1.1rem; color: var(--fg); white-space: nowrap;

.chip b { color: var(--accent); }
.chip .prob { font-size: 0.72em; color: var(--fg2); margin-left: 4px; }
.chip.chip-hit { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--chip-bg)); }
.chip.chip-miss { opacity: 0.6; }
.hit-icon { margin-left: 5px; font-size: 0.9em; }

.bet-note {

  background: color-mix(in srgb, var(--gold) 14%, transparent);
  border: 1px solid var(--gold); color: var(--fg2);
}

.bet-row-emphasized {
  background: color-mix(in srgb, var(--ok) 10%, transparent);
  border: 1px solid var(--ok); border-radius: 8px; padding: 8px 10px; margin-top: 8px;

.bet-row-emphasized .bet-type { color: var(--ok); font-weight: 700; }
.bet-row-emphasized .chip { border-color: var(--ok); font-size: 1.15rem; font-weight: 600; }
.tan-badge {
  display: inline-block; margin-left: 6px; font-size: 0.78rem; font-weight: 600;
  background: var(--ok); color: #fff; padding: 2px 8px; border-radius: 10px; vertical-align: middle;

.rakuten-row { padding: 6px 14px; border-bottom: 1px solid var(--border); text-align: center; }
.rakuten-row a { color: var(--accent); font-size: 0.95rem; font-weight: 600; text-decoration: none; }
.rakuten-row a:active { opacity: 0.7; }

.retrigger-row { padding: 8px 14px; border-bottom: 1px solid var(--border); }
.retrigger-btn {
  width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--accent);
  background: transparent; color: var(--accent); font-size: 1rem; font-weight: 700;
  cursor: pointer;
}
.retrigger-btn:disabled { opacity: 0.6; cursor: default; }

.manken-box { padding: 10px 14px; border-top: 1px solid var(--border); background: var(--bg2); }
.manken-box h3 { margin: 0 0 8px; font-size: 0.95rem; font-weight: 700; color: var(--gold); display: flex; align-items: center; gap: 6px; }
.manken-box .stars { color: var(--gold); letter-spacing: 1px; }

.manken-reason { font-size: 0.88rem; color: var(--fg2); margin-top: 6px; }
.manken-skip { font-size: 0.95rem; color: var(--fg2); padding: 2px 0; }

.result-box { padding: 10px 14px; border-top: 1px solid var(--border); background: var(--bg2); }
.result-box h3 { margin: 0 0 6px; font-size: 0.95rem; font-weight: 700; color: var(--ok); }
.finish-list { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.finish-item { font-size: 0.95rem; color: var(--fg); }
.finish-item .pos { color: var(--gold); font-weight: 700; margin-right: 3px; }
.payout-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.payout-chip {
  background: var(--card); border: 1px solid var(--ok); border-radius: 20px;
  padding: 5px 11px; font-size: 0.92rem; color: var(--fg);
}
.payout-chip b { color: var(--ok); }

footer { text-align: center; color: var(--fg3); font-size: 0.8rem; padding: 10px; flex: 0 0 auto; }
</style>

 {"単勝": {"combo": "4", "payout": 370}, "3連複": {"combo": "3-4-6", "payout": 3180}, "3連単": {"combo": "4-3-6", "payout": 15690}}, "manken": {"skipped": false, "n_horses": 13, "stars": 2, "candidates": ["◎11番 ラファエラエンゼル（馬60%/騎35%）[穴流込]", "○8番 ボールドチャー（馬80%/騎33%）", "▲13番 アマノハバキリ（馬67%/騎29%）", "△6番 ダイジェスト（馬40%/騎35%） 🔥Full3 - 2位", "△2番 セイノスケ（馬60%/騎12%）", "×5番 ビービーシャーンス（馬50%/騎12%）", "⚡4番 シドニーホバート（Full3 1位 0.736）[万馬券候補外・要注意]", "⚡12番 レジェンドマスター（Full3 3位 0.450）[万馬券候補外・要注意]"], "reasons": ["13頭+穴系1頭"]}, "rakuten_url": "https://keiba.rakuten.co.jp/race_card/list/RACEID/202610021900000012", "note": null}]}], "health": {"last_run": "2026-10-04T21:46:36.009755", "ok": true, "errors": []}, "winning_venues": []};
const WORKER_URL = 'https://chihou-trigger.peykyo.workers.dev';

function reloadPage() {
  // ホーム画面ショートカットで開くと（chromeless表示のため）ブラウザのリロードUIが
  // 無いことがあり、手動更新の手段が無くなる。ボタンから明示的にリロードさせる。
  // キャッシュされた古いHTMLが返らないよう、URLにタイムスタンプを付けて強制リロードする。
  const btn = document.getElementById('page-refresh-btn');
  if (btn) btn.classList.add('spinning');
  const url = new URL(location.href);
  url.searchParams.set('_r', Date.now());
  location.href = url.toString();
}

// 2026-09-23追加: 更新ボタンは毎回location.hrefで完全リロードするため、選んでいた
// 競馬場・レース・前日/当日タブがJS変数のリセットで失われ、常に先頭（大井）に戻って
// しまっていた。見ていた場所をlocalStorageに覚えておき、次回表示時に復元する
// （閲覧者のブラウザだけに残る情報。プライベートブラウジング等で使えなくても
// 単に既定表示に戻るだけなのでtry/catchで無視する）。
const LAST_VIEW_KEY = 'keiba_last_view';
function loadSavedView() {
  try {
    return JSON.parse(localStorage.getItem(LAST_VIEW_KEY) || 'null');
  } catch (e) { return null; }
}
function saveView() {
  try {
    localStorage.setItem(LAST_VIEW_KEY, JSON.stringify({ venue: curVenue, race: curRace, day: curDay }));
  } catch (e) { /* 保存できなくても既定表示に戻るだけなので無視 */ }
}
const _savedView = loadSavedView();
let curVenue = (_savedView && DATA.venues.some(v => v.key === _savedView.venue))
  ? _savedView.venue
  : (DATA.venues.length ? DATA.venues[0].key : null);
let curRace  = (_savedView && typeof _savedView.race === 'number') ? _savedView.race : null;
let curDay   = (_savedView && (_savedView.day === 'prev' || _savedView.day === 'today'))
  ? _savedView.day
  : 'today';  // 'today' | 'prev'（2026-09-05追加: 前日/当日タブ）
let triggerCooldownUntil = 0;

async function requestReupdate(raceNo) {
  const btn = document.getElementById('retrigger-btn');
  if (!btn || Date.now() < triggerCooldownUntil) return;
  btn.disabled = true;
  btn.textContent = '送信中...';
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({venue: curVenue, race_no: raceNo})
    });
    if (res.ok) {
      const data = await res.json().catch(() => ({}));
      triggerCooldownUntil = Date.now() + 90000;
      if (data && data.token_warning) {
        btn.textContent = `⚠️ 送信済み（GitHubトークンが残り${data.token_warning.days_left}日で失効します）`;
      } else {
        btn.textContent = '✅ 送信しました（1〜2分後に更新）';
      }
      setTimeout(() => {
        const b = document.getElementById('retrigger-btn');
        if (b) { b.disabled = false; b.textContent = '🔄 最新オッズで再予想'; }
      }, 90000);
    } else {
      btn.textContent = '⚠️ 送信失敗（後でもう一度）';
      btn.disabled = false;
    }
  } catch (e) {
    btn.textContent = '⚠️ 通信エラー（後でもう一度）';
    btn.disabled = false;
  }
}

function pickInitialRace(races) {
  // 未確定の最初のレース（＝これから買うべきレース）を初期選択にする
  const unconfirmed = races.find(r => !r.confirmed);
  return unconfirmed ? unconfirmed.no : (races[0] ? races[0].no : null);
}

function dayRaces(venue) {
  return curDay === 'prev' ? (venue.prev_races || []) : (venue.races || []);
}

function selectDay(day) {
  if (day === curDay) return;
  curDay = day;
  curRace = null;
  render();
}

function renderHealthWarning() {
  const el = document.getElementById('health-warn');
  if (!el) return;
  const h = DATA.health;
  if (h && h.ok === false && (h.errors || []).length) {
    el.innerHTML = `<div class="health-warn">⚠️ 前回の自動更新で一部失敗しました: ${h.errors.slice(0, 2).join(' / ')}</div>`;
  } else {
    el.innerHTML = '';
  }
}

function render() {
  renderHealthWarning();
  const main = document.getElementById('main');
  if (!DATA.venues.length) {
    main.innerHTML = '<p class="empty">🏇 本日は対応競馬場の開催がありません</p>';
    document.getElementById('tabs').innerHTML = '';
    document.getElementById('races').innerHTML = '';
    return;
  }
  const venue = DATA.venues.find(v => v.key === curVenue) || DATA.venues[0];
  curVenue = venue.key;

  // 前日/当日トグル（2026-09-05追加）。データが無い方も選べるようにしておき、
  // 選んだ時に「開催が無い/前日データが無い」を案内する（ボタン自体は隠さない）。
  const prevLabel = venue.prev_date ? `前日 ${venue.prev_date.slice(5)}` : '前日';
  document.getElementById('day-toggle').innerHTML = `
    <button class="day-btn ${curDay === 'prev'  ? 'active' : ''}" onclick="selectDay('prev')">${prevLabel}</button>
    <button class="day-btn ${curDay === 'today' ? 'active' : ''}" onclick="selectDay('today')">当日</button>
  `;

  const races = dayRaces(venue);
  if (curRace === null || !races.some(r => r.no === curRace)) curRace = pickInitialRace(races);

  // 競馬場タブ（バックテストで3連単ROIが安定して良かった場に🎯マーク。買い目ロジックは
  // 変えていない、あくまで購入判断の参考表示）
  const winSet = new Set(DATA.winning_venues || []);
  document.getElementById('tabs').innerHTML = DATA.venues.map(v => {
    const winMark = winSet.has(v.key) ? '<span class="win-mark">🎯</span>' : '';
    return `<button class="tab-btn ${v.key === curVenue ? 'active' : ''}" onclick="selectVenue('${v.key}')">${v.label}${winMark}</button>`;
  }).join('');

  if (!races.length) {
    document.getElementById('races').innerHTML = '';
    main.innerHTML = curDay === 'prev'
      ? '<p class="empty">前回開催のデータがまだありません</p>'
      : '<p class="empty">🏇 本日は開催がありません（前日タブは見られます）</p>';
    saveView();
    return;
  }

  // レースチップ（万馬券予想で★が付いていれば荒れそうなレースとして表示）
  document.getElementById('races').innerHTML = races.map(r => {
    const mk = r.manken;
    const starHtml = (mk && !mk.skipped && mk.stars > 0) ? `<span class="manken-star">${'★'.repeat(mk.stars)}</span>` : '';
    return `<div class="race-chip ${r.confirmed ? 'confirmed' : ''} ${r.no === curRace ? 'active' : ''}" onclick="selectRace(${r.no})">
       ${r.no}R<span class="dot"></span>${starHtml}
     </div>`;
  }).join('');

  const race = races.find(r => r.no === curRace);
  if (!race) { main.innerHTML = '<p class="empty">レースを選んでください</p>'; return; }

  const horseRows = race.horses.map(h => {
    const morningHtml = h.morning_sym ? `<span class="morning-sym">朝${h.morning_sym}</span>` : '';
    const oddsPopHtml = (h.odds !== undefined)
      ? `${h.odds.toFixed(1)}倍${h.popularity !== undefined ? `<span class="pop">${h.popularity}人気</span>` : ''}`
      : '-';
    return `
    <div class="horse-row">
      <span class="sym-cell"><span class="sym">${h.sym}</span>${morningHtml}</span>
      <span class="hno">${h.horse_no}</span>
      <span class="hname"><span class="hname-main">${h.horse_name}</span>${h.jockey ? `<span class="jockey">${h.jockey}</span>` : ''}</span>
      <span class="odds-pop">${oddsPopHtml}</span>
      <span class="score">${h.score.toFixed(2)}</span>
    </div>`;
  }).join('');

  let betHtml = '';
  const isWinVenue = winSet.has(curVenue);
  let betTypes = Object.keys(race.bets || {});
  if (isWinVenue) {
    // 🎯場では3連単を先頭に出して目立たせる（買い目自体・順序以外のロジックは不変）
    betTypes = betTypes.sort((a, b) => (a === '3連単' ? -1 : b === '3連単' ? 1 : 0));
  }
  if (betTypes.length) {
    betHtml = betTypes.map(bt => {
      // 2026-09-05追加: 確定後、買い目チップに的中/不的中アイコンを付ける。
      // 3連単は順序一致、3連複は順不同一致で判定する。
      // 2026-09-23追加: 「単勝穴」は表示上のラベルで実際の券種は単勝なので、
      // 払戻データは「単勝」のものを見る（race.payoutsに「単勝穴」は存在しない）。
      const payoutKey = bt === '単勝穴' ? '単勝' : bt;
      const payout = race.payouts && race.payouts[payoutKey];
      const normCombo = s => s.split('-').map(Number).sort((a, b) => a - b).join('-');
      const chips = race.bets[bt].map(it => {
        const probHtml = (it.prob !== undefined) ? `<span class="prob">的中${it.prob}%</span>` : '';
        let hitHtml = '', chipCls = '';
        if (race.confirmed) {
          const hit = payout && payout.combo && (bt === '3連単'
            ? it.combo === payout.combo
            : normCombo(it.combo) === normCombo(payout.combo));
          chipCls = hit ? ' chip-hit' : ' chip-miss';
          hitHtml = hit ? '<span class="hit-icon">✅</span>' : '<span class="hit-icon">✕</span>';
        }
        return `<span class="chip${chipCls}">${it.combo} <b>${it.amount.toLocaleString()}円</b>${probHtml}${hitHtml}</span>`;
      }).join('');
      const emphasize = isWinVenue && bt === '3連単';
      // 2026-09-19追加: 単勝はバックテストで頑健なプラスが出たが、ライブでの前向き検証中
      // （3連単はバックテストとライブの食い違いが未解決のため、鵜呑みにしない意味で明示）
      const badge = emphasize ? '<span class="tan-badge">🎯的中実績が良い場</span>'
                  : bt === '単勝' ? '<span class="tan-badge">🧪前向き検証中(1点100円)</span>'
                  : bt === '単勝穴' ? '<span class="tan-badge">🕵️穴狙い・検証中(1点100円)</span>'
                  : '';
      return `<div class="bet-row ${emphasize ? 'bet-row-emphasized' : ''}"><span class="bet-type">${bt}${badge}</span><div class="chips">${chips}</div></div>`;
    }).join('');
  } else {
    betHtml = '<div class="bet-row no-bet">見送り（期待値基準を満たす買い目なし）</div>';
  }

  // 2026-09-09追加: 大井の大頭数レース等、買い目自体は出すが「参考程度」と
  // 注意喚起したいケース用のコメント表示。
  const noteHtml = race.note ? `<div class="bet-note">⚠️ ${race.note}</div>` : '';

  let mankenHtml = '';
  if (race.manken) {
    if (race.manken.skipped) {
      mankenHtml = `
        <div class="manken-box">
          <h3>⚡ 万馬券予想</h3>
          <div class="manken-skip">見送り（${race.manken.skip_reason || '条件不足'}）</div>
        </div>`;
    } else if (race.manken.stars > 0) {
      const candHtml = (race.manken.candidates || []).map(c => `<div class="manken-cand">${c}</div>`).join('');
      const reasonHtml = (race.manken.reasons || []).join(' / ');
      mankenHtml = `
        <div class="manken-box">
          <h3>⚡ 万馬券予想 <span class="stars">${'★'.repeat(race.manken.stars)}</span></h3>
          ${candHtml}
          ${reasonHtml ? `<div class="manken-reason">${reasonHtml}</div>` : ''}
        </div>`;
    }
  }

  let resultHtml = '';
  if (race.confirmed) {
    const finishHtml = (race.top3 || []).map(t =>
      `<span class="finish-item"><span class="pos">${t.finish_pos}着</span>${t.horse_no}番 ${t.horse_name}</span>`
    ).join('');
    const payoutTypes = Object.keys(race.payouts || {});
    const payoutHtml = payoutTypes.map(bt => {
      const p = race.payouts[bt];
      return `<span class="payout-chip">${bt} ${p.combo} <b>${p.payout ? p.payout.toLocaleString() + '円' : '-'}</b></span>`;
    }).join('');
    resultHtml = `
      <div class="result-box">
        <h3>結果</h3>
        <div class="finish-list">${finishHtml || '<span class="finish-item">着順情報なし</span>'}</div>
        <div class="payout-chips">${payoutHtml}</div>
      </div>`;
  }

  const retriggerHtml = race.confirmed ? '' : `
      <div class="retrigger-row">
        <button id="retrigger-btn" class="retrigger-btn" onclick="requestReupdate(${race.no})">🔄 最新オッズで再予想</button>
      </div>`;

  const rakutenHtml = race.rakuten_url
    ? `<div class="rakuten-row"><a href="${race.rakuten_url}" target="_blank" rel="noopener">🔗 楽天競馬でこのレースを見る</a></div>`
    : '';

  main.innerHTML = `
    <section class="race-card">
      <div class="race-head">
        <span class="race-no">${race.no}R</span>
        <span class="race-n">${race.n_horses}頭</span>
        ${race.post_time ? `<span class="post-time">発走 ${race.post_time}</span>` : ''}
        <span class="status-badge ${race.confirmed ? 'confirmed' : 'pending'}">${race.confirmed ? '確定' : '未確定'}</span>
      </div>
      ${rakutenHtml}
      ${retriggerHtml}
      <div class="horses">${horseRows}</div>
      <div class="bets">${betHtml}${noteHtml}</div>
      ${mankenHtml}
      ${resultHtml}
    </section>`;
  saveView();
}

function selectVenue(key) { curVenue = key; curRace = null; render(); }
function selectRace(no) { curRace = no; render(); }

render();
</script>
