<style>
:root {
  color-scheme: light dark;
  --bg: #0f1420; --bg2: #161d2e; --card: #1b2437; --border: #2a3550;
  --fg: #f5f7fb; --fg2: #c7d0e2; --fg3: #98a3bd;
  --gold: #e0bb68; --gold2: #f5e0a3; --accent: #6cadff;
  --chip-bg: #29354e; --ok: #5cbf8d; --pending: #7f8bab; --done: #3d9bff;
}
@media (prefers-color-scheme: light) {
  :root:not([data-force-dark]) {
    --bg: #f5f3ee; --bg2: #ffffff; --card: #ffffff; --border: #e0dccf;
    --fg: #161512; --fg2: #38362f; --fg3: #5c594f;
    --gold: #8a6a18; --gold2: #5c4a10; --accent: #0f5cc2;
    --chip-bg: #eeeae0; --ok: #226e46; --pending: #8a8677; --done: #0a62d6;
  }
}
/* 2026-09-06追加: 「文字が見えづらい」との指摘を受け、基準フォントサイズを上げ、
   薄い文字色（fg2/fg3）を全体的に濃く（コントラスト強く）した。上のカラー変数の
   変更と合わせて対応。 */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  font-size: 18px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden;
}
header {
  padding: 10px 12px 0;
  background: linear-gradient(180deg, var(--bg2), var(--bg));
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
header .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
header h1 { margin: 0; font-size: 1.15rem; color: var(--gold2); }
header .top-right { display: flex; align-items: center; gap: 8px; }
header .updated { font-size: 0.8rem; color: var(--fg3); }
.refresh-btn {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--chip-bg); color: var(--fg2);
  font-size: 0.95rem; line-height: 1; cursor: pointer; display: flex;
  align-items: center; justify-content: center; padding: 0;
}
.refresh-btn:active { transform: scale(0.92); }
.refresh-btn.spinning { animation: spin 0.7s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

.health-warn {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px; margin-bottom: 8px;
  background: #4a2a1a; border: 1px solid #a05a2c; border-radius: 6px;
  color: #f0c8a0; font-size: 0.78rem;
}
@media (prefers-color-scheme: light) {
  :root:not([data-force-dark]) .health-warn { background: #fbe9dc; border-color: #d98a3f; color: #7a4413; }
}

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 0 0 auto; padding: 7px 15px; border-radius: 16px 16px 0 0;
  background: var(--bg); border: 1px solid var(--border); border-bottom: none;
  color: var(--fg2); font-size: 0.95rem; cursor: pointer;
}
.tab-btn.active { background: var(--card); color: var(--gold2); font-weight: 700; }
.win-mark { margin-left: 3px; }

.day-toggle { display: flex; gap: 6px; margin-top: 6px; }
.day-btn {
  flex: 0 0 auto; padding: 6px 13px; border-radius: 14px;
  background: var(--chip-bg); border: 1px solid var(--border);
  color: var(--fg2); font-size: 0.88rem; font-weight: 600; cursor: pointer;
}
.day-btn.active { background: var(--gold); border-color: var(--gold); color: #1c1c1c; font-weight: 700; }

.races-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }
.race-chip {
  flex: 0 0 auto; min-width: 2.4em; text-align: center; padding: 6px 2px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--chip-bg);
  color: var(--fg2); font-size: 0.92rem; font-weight: 600; cursor: pointer; position: relative;
}
.race-chip .dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  background: var(--pending); margin-left: 3px; vertical-align: middle;
}
/* 2026-11-03: スマホで緑が見づらいとの指摘。確定の丸は他の「的中」の緑と別の青にし、少し大きくした */
.race-chip.confirmed .dot { background: var(--done); box-shadow: 0 0 0 2px color-mix(in srgb, var(--done) 30%, transparent); }
.race-chip.active { border-color: var(--gold); color: var(--gold2); font-weight: 700; }
.race-chip .manken-star { display: block; font-size: 0.72em; color: var(--gold); line-height: 1.3; letter-spacing: -1px; }

main { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px 24px; max-width: 640px; margin: 0 auto; width: 100%; }
.empty { color: var(--fg2); font-size: 1.15rem; text-align: center; padding: 60px 20px; }

.race-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.race-head {
  display: flex; align-items: baseline; gap: 10px; padding: 10px 14px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
}
.race-no { font-weight: 700; font-size: 1.4rem; color: var(--gold2); }
.race-n { font-size: 0.92rem; color: var(--fg2); }
.post-time { font-size: 0.92rem; color: var(--fg2); margin-left: auto; }
.status-badge { font-size: 0.85rem; font-weight: 600; padding: 3px 10px; border-radius: 10px; }
.status-badge.pending { background: var(--chip-bg); color: var(--fg2); }
.status-badge.confirmed { background: var(--ok); color: #fff; }

.horses { padding: 6px 12px; }
.horse-row {

.alert-note { color: var(--fg3); font-size: 0.82em; margin-left: 6px; }
.morning-sym { font-size: 0.65em; color: var(--fg2); font-weight: 600; white-space: nowrap; }
.hno { color: var(--fg2); font-weight: 700; text-align: right; }
.hname { display: flex; flex-direction: column; overflow: hidden; line-height: 1.3; }
.hname-main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 1rem; }
.jockey { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.62em; color: var(--fg3); font-weight: 500; }
.odds-pop { font-size: 0.68em; color: var(--fg2); font-weight: 600; text-align: right; line-height: 1.35; font-variant-numeric: tabular-nums; }
.odds-pop .pop { display: block; }
.score { color: var(--fg2); font-size: 0.75em; text-align: right; font-variant-numeric: tabular-nums; }

.bets { padding: 8px 14px 12px; border-top: 1px solid var(--border); }

.chip {

.chip b { color: var(--accent); }
.chip .prob { font-size: 0.72em; color: var(--fg2); margin-left: 4px; }
.chip.chip-hit { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--chip-bg)); }
.chip.chip-miss { opacity: 0.6; }
.hit-icon { margin-left: 5px; font-size: 0.9em; }

.bet-note {

  background: color-mix(in srgb, var(--gold) 14%, transparent);

.bet-row-emphasized {

.tan-badge {

  background: var(--ok); color: #fff; padding: 2px 8px; border-radius: 10px; vertical-align: middle;

.rakuten-row { padding: 6px 14px; border-bottom: 1px solid var(--border); text-align: center; }
.rakuten-row a { color: var(--accent); font-size: 0.95rem; font-weight: 600; text-decoration: none; }

.retrigger-row { padding: 8px 14px; border-bottom: 1px solid var(--border); }

}
.retrigger-btn:disabled { opacity: 0.6; cursor: default; }


.result-box { padding: 10px 14px; border-top: 1px solid var(--border); background: var(--bg2); }

.payout-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  padding: 5px 11px; font-size: 0.92rem; color: var(--fg);

.payout-chip b { color: var(--ok); }

footer { text-align: center; color: var(--fg3); font-size: 0.8rem; padding: 10px; flex: 0 0 auto; }
</style>

      const normCombo = s => s.split('-').map(Number).sort((a, b) => a - b).join('-');
      const chips = race.bets[bt].map(it => {
        const probHtml = (it.prob !== undefined) ? `<span class="prob">的中${it.prob}%</span>` : '';
        let hitHtml = '', chipCls = '';
        if (race.confirmed) {
          const hit = payout && payout.combo && (bt === '3連単'
            ? it.combo === payout.combo
            : normCombo(it.combo) === normCombo(payout.combo));
          chipCls = hit ? ' chip-hit' : ' chip-miss';
          hitHtml = hit ? '<span class="hit-icon">✅</span>' : '<span class="hit-icon">✕</span>';
        }
        return `<span class="chip${chipCls}">${it.combo} <b>${it.amount.toLocaleString()}円</b>${probHtml}${hitHtml}</span>`;
      }).join('');
      const emphasize = isWinVenue && bt === '3連単';
      // 2026-09-19追加: 単勝はバックテストで頑健なプラスが出たが、ライブでの前向き検証中
      // （3連単はバックテストとライブの食い違いが未解決のため、鵜呑みにしない意味で明示）
      const badge = emphasize ? '<span class="tan-badge">🎯的中実績が良い場</span>'
                  : bt === '単勝' ? '<span class="tan-badge">🧪前向き検証中(1点100円)</span>'
                  : bt === '単勝穴' ? '<span class="tan-badge">🕵️穴狙い・検証中(1点100円)</span>'
                  : '';
      return `<div class="bet-row ${emphasize ? 'bet-row-emphasized' : ''}"><span class="bet-type">${bt}${badge}</span><div class="chips">${chips}</div></div>`;
    }).join('');
  } else {
    betHtml = '<div class="bet-row no-bet">見送り（期待値基準を満たす買い目なし）</div>';
  }

  // 2026-09-09追加: 大井の大頭数レース等、買い目自体は出すが「参考程度」と
  // 注意喚起したいケース用のコメント表示。
  const noteHtml = race.note ? `<div class="bet-note">⚠️ ${race.note}</div>` : '';

  // 万馬券警戒度（manba_alert.py）。★は万馬券確率の順位、%はその★だった時の実際の万馬券率
  let alertHtml = '';
  if (race.alert && race.alert.stars > 0) {
    const rate = race.alert.rate != null ? ` 過去の万馬券率${Math.round(race.alert.rate * 100)}%` : '';
    const prov = race.confirmed ? '' : '<span class="alert-note">（確定前は★が高めに出ます）</span>';
    alertHtml = `<div class="alert-row"><span class="alert-star">${'★'.repeat(race.alert.stars)}</span> 万馬券警戒${rate}${prov}</div>`;
  }

  let resultHtml = '';
  if (race.confirmed) {
    const finishHtml = (race.top3 || []).map(t =>
      `<span class="finish-item"><span class="pos">${t.finish_pos}着</span>${t.horse_no}番 ${t.horse_name}</span>`
    ).join('');
    const payoutTypes = Object.keys(race.payouts || {});
    const payoutHtml = payoutTypes.map(bt => {
      const p = race.payouts[bt];
      return `<span class="payout-chip">${bt} ${p.combo} <b>${p.payout ? p.payout.toLocaleString() + '円' : '-'}</b></span>`;
    }).join('');
    resultHtml = `
      <div class="result-box">
        <h3>結果</h3>
        <div class="finish-list">${finishHtml || '<span class="finish-item">着順情報なし</span>'}</div>
        <div class="payout-chips">${payoutHtml}</div>
      </div>`;
  }

  const retriggerHtml = race.confirmed ? '' : `
      <div class="retrigger-row">
        <button id="retrigger-btn" class="retrigger-btn" onclick="requestReupdate(${race.no})">🔄 最新オッズで再予想</button>
      </div>`;

  const rakutenHtml = race.rakuten_url
    ? `<div class="rakuten-row"><a href="${race.rakuten_url}" target="_blank" rel="noopener">🔗 楽天競馬でこのレースを見る</a></div>`
    : '';

  main.innerHTML = `
    <section class="race-card">
      <div class="race-head">
        <span class="race-no">${race.no}R</span>
        <span class="race-n">${race.n_horses}頭</span>
        ${race.post_time ? `<span class="post-time">発走 ${race.post_time}</span>` : ''}
        <span class="status-badge ${race.confirmed ? 'confirmed' : 'pending'}">${race.confirmed ? '確定' : '未確定'}</span>
      </div>
      ${rakutenHtml}
      ${alertHtml}
      ${retriggerHtml}
      <div class="horses">${horseRows}</div>
      <div class="bets">${betHtml}${noteHtml}</div>
      ${resultHtml}
    </section>`;
  saveView();
}

function selectVenue(key) { curVenue = key; curRace = null; render(); }
function selectRace(no) { curRace = no; render(); }

render();
</script>
</body>
</html>
