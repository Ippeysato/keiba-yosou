<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>実績ダッシュボード</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#161512;--ink2:#52514e;--muted:#898781;--grid:#e6e4dc;--axis:#c3c2b7;--line:rgba(11,11,11,.12);--pos:#2a78d6;--neg:#e34948;--accent:#8a6a18}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#1a2235;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2a3045;--axis:#4a5068;--line:rgba(255,255,255,.12);--pos:#3987e5;--neg:#e66767;--accent:#e0bb68}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.25rem;margin:0 0 2px}
.sub{color:var(--ink2);font-size:.85rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:.85rem;color:var(--ink2)}
select,input[type=date]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:.8rem;color:var(--muted)}
.chips .t{min-width:34px}
.chip{font:inherit;font-size:.8rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip[aria-pressed=false]{opacity:.38}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.k .l{font-size:.75rem;color:var(--ink2)}
.k .v{font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums}
h2{font-size:.95rem;margin:0 0 6px;font-weight:600}
.cw{position:relative;width:100%}
.cw svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:.78rem;box-shadow:0 2px 10px rgba(0,0,0,.18);display:none;white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums}
.tip b{font-weight:600}
.lg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.78rem;color:var(--ink2);margin:0 0 6px}
.lg span{display:flex;align-items:center;gap:5px}.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--ink2);padding:5px 8px;text-align:right}th:first-child{text-align:left}
.dayrow td{font-weight:600;background:rgba(138,106,24,.10);border-top:2px solid var(--axis)}.pos{color:var(--pos)}.sm{color:var(--muted);font-size:.72rem}
td{padding:5px 8px;text-align:right;border-top:1px solid var(--line)}td:first-child{text-align:left}
.heat td{border:0;text-align:center;border-radius:4px}.heat td:first-child{text-align:left}.heat small{display:block;font-size:.66rem;color:var(--ink2)}
details summary{cursor:pointer;color:var(--ink2);font-size:.85rem}
.note{font-size:.76rem;color:var(--muted);margin-top:10px}
.neg{color:var(--neg)}
</style>
</head>
<body>
<div class="wrap">
<h1>実績ダッシュボード</h1>
<p class="sub" id="sub"></p>

<div class="card">
  <div class="ctl">
    <label>切り口 <select id="by"><option value="all">全体</option><option value="v" selected>馬場別</option><option value="b">券種別</option></select></label>
    <label>指標 <select id="met"><option value="pl">収支（円）</option><option value="roi">回収率（%）</option><option value="inv">投資額（円）</option></select></label>
    <label>集計 <select id="gran"><option value="d">日別</option><option value="w">週別</option></select></label>
    <label>期間 <select id="rng"><option value="0">全期間</option><option value="30">直近30日</option><option value="14">直近14日</option><option value="7">直近7日</option><option value="x">指定</option></select></label>
    <label><input type="date" id="from"> 〜 <input type="date" id="to"></label>
  </div>
  <div class="chips"><span class="t">馬場</span><span id="cv" style="display:contents"></span></div>
  <div class="chips"><span class="t">券種</span><span id="cb" style="display:contents"></span></div>
</div>

<div class="kpi" id="kpi"></div>

<div class="card">
  <h2 id="t1"></h2>
  <div class="lg" id="lg1"></div>
  <div class="cw" id="c1"></div>
</div>
<div class="card">
  <h2 id="t2"></h2>
  <div class="lg" id="lg2"></div>
  <div class="cw" id="c2"></div>
</div>
<div class="card">
  <h2>馬場 × 券種の回収率 <span style="font-weight:400;color:var(--ink2);font-size:.78rem">（青＝100%超、赤＝100%未満、小さい数字は投資額）</span></h2>
  <div style="overflow-x:auto"><table class="heat" id="heat"></table></div>
</div>
<div class="card">
  <details open><summary>表で見る</summary>
    <div class="ctl" style="margin-top:8px">
      <label>表示 <select id="tv"><option value="race" selected>レースごとの明細＋その日の損益</option><option value="per">期間ごとの数字</option></select></label>
      <label id="tordl">並び <select id="tord"><option value="new" selected>新しい日が上</option><option value="old">古い日が上</option></select></label>
    </div>
    <div style="overflow-x:auto;margin-top:8px"><table id="tbl"></table></div>
    <p class="note" id="tnote"></p></details>
</div>
<p class="note">元データは live_tracking（結果確定のたびの自動記録。9/18以降は「発走前の最後の予想」、9/17以前は「その日最後の予想」で集計）。単勝・単勝穴の前向き検証の詳細は track_win_forward.py を使ってください。<br>
2026/9/10以降は買い目を絞る運用に変わっており、それ以前（馬場×券種ごとに1日約1万円）と投資額の水準が大きく違います。</p>
</div>

const BPAL={'3連単':'#2a78d6','3連複':'#eb6834','単勝セット':'#6250d6','単勝':'#1baf7a','単勝穴':'#eda100','3連複穴':'#2aa3b8','馬連':'#e87ba4'};
const FALL=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948'];
const VS=[...new Set(R.map(x=>x.v))].sort((a,b)=>Object.keys(VPAL).indexOf(a)-Object.keys(VPAL).indexOf(b));
const BS=[...new Set(R.map(x=>x.b))].sort((a,b)=>{const i=BN_ORDER.indexOf(a),j=BN_ORDER.indexOf(b);return (i<0?99:i)-(j<0?99:j)});
const vc=k=>VPAL[k]||FALL[VS.indexOf(k)%FALL.length];
const bc=k=>BPAL[k]||FALL[BS.indexOf(k)%FALL.length];
const vn=k=>VL[k]||k;
const on={v:new Set(VS),b:new Set(BS)};
const $=id=>document.getElementById(id);
const MAXD=R.reduce((a,x)=>x.d>a?x.d:a,'');
const MIND=R.reduce((a,x)=>x.d<a?x.d:a,'9999');
const yen=v=>(v<0?'-':'')+'¥'+Math.abs(Math.round(v)).toLocaleString();
const pct=v=>(Math.round(v*10)/10)+'%';
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00');t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};
const wk=d=>{const t=new Date(d+'T00:00:00');t.setDate(t.getDate()-((t.getDay()+6)%7));return t.toISOString().slice(0,10)};
const val=(m,i,r)=>m==='pl'?r-i:m==='roi'?(i>0?r/i*100:null):i;
const fmt=(m,v)=>v===null||v===undefined?'-':m==='roi'?pct(v):yen(v);
const LS='perf_dashboard_state_v1';
const TV_OPTS=['race','per'],TO_OPTS=['new','old'];
function saveState(){try{localStorage.setItem(LS,JSON.stringify({by:$('by').value,met:$('met').value,gran:$('gran').value,rng:$('rng').value,tv:$('tv').value,tord:$('tord').value,v:[...on.v],b:[...on.b],kv:VS,kb:BS}))}catch(e){}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(!s)return;
  ['by','met','gran'].forEach(k=>{if(s[k]&&[...$(k).options].some(o=>o.value===s[k]))$(k).value=s[k]});
  if(TV_OPTS.includes(s.tv))$('tv').value=s.tv;if(TO_OPTS.includes(s.tord))$('tord').value=s.tord;
  if(s.rng&&s.rng!=='x'&&[...$('rng').options].some(o=>o.value===s.rng))$('rng').value=s.rng;
  // 2026-11-24: 前回の保存より後に増えた馬場・券種（例: 3連複穴）は、OFFのまま隠れないよう最初からONにする
  if(Array.isArray(s.v)){on.v=new Set(s.v.filter(k=>VS.includes(k)));const kv=s.kv||VS;VS.forEach(k=>{if(!kv.includes(k))on.v.add(k)})}
  if(Array.isArray(s.b)){on.b=new Set(s.b.filter(k=>BS.includes(k)));const kb=s.kb||BS.filter(k=>k!=='3連複穴');BS.forEach(k=>{if(!kb.includes(k))on.b.add(k)})}}catch(e){}}

function chips(el,keys,name,col,set){
  const box=$(el);box.innerHTML='';
  keys.forEach(k=>{const b=document.createElement('button');b.type='button';b.className='chip';
    b.innerHTML='<i style="background:'+col(k)+'"></i>'+name(k);
    const paint=()=>b.setAttribute('aria-pressed',set.has(k));
    b.onclick=()=>{set.has(k)?set.delete(k):set.add(k);paint();update()};paint();box.appendChild(b)});
}
function niceTicks(lo,hi,cnt){
  if(hi===lo){hi=lo+1}
  const raw=(hi-lo)/cnt,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag;
  const step=(n<1.5?1:n<3?2:n<7?5:10)*mag;
  const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step,t=[];
  for(let v=a;v<=b+step/2;v+=step)t.push(Math.round(v*1e6)/1e6);
  return t;
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function draw(o){
  const el=o.el,W=Math.max(320,el.clientWidth||700),H=o.h,ml=o.ml||66,mr=14,mt=8,mb=26,pw=W-ml-mr,ph=H-mt-mb;
  const n=o.labels.length;
  if(!n){el.innerHTML='<p class="note">この条件に該当するデータがありません。</p>';return}
  let lo=o.base,hi=o.base;
  const stacked=o.type==='bar'&&o.stacked;
  if(stacked){for(let j=0;j<n;j++){let p=0,q=0;o.series.forEach(s=>{const v=s.data[j]||0;v>=0?p+=v:q+=v});hi=Math.max(hi,p);lo=Math.min(lo,q)}}
  else o.series.forEach(s=>s.data.forEach(v=>{if(v!==null&&v!==undefined){hi=Math.max(hi,v);lo=Math.min(lo,v)}}));
  const pad=(hi-lo)*0.06||1;hi+=pad;if(lo<o.base-1e-9||lo!==o.base)lo-=pad;
  const tk=niceTicks(lo,hi,4),y0=tk[0],y1=tk[tk.length-1];
  const Y=v=>mt+ph-(v-y0)/(y1-y0)*ph;
  const band=pw/n,X=j=>o.type==='bar'?ml+band*(j+.5):(n===1?ml+pw/2:ml+pw*j/(n-1));
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">';
  tk.forEach(v=>{s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" style="stroke:var(--grid)"/>'+
    '<text x="'+(ml-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" style="fill:var(--muted);font-size:11px">'+esc(o.fy(v))+'</text>'});
  s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(o.base)+'" y2="'+Y(o.base)+'" style="stroke:var(--axis)" stroke-width="1.2" '+(o.type==='line'?'stroke-dasharray="4 4"':'')+'/>';
  const every=Math.max(1,Math.ceil(n/Math.floor(pw/54)));
  o.labels.forEach((l,j)=>{if(j%every===0||j===n-1)s+='<text x="'+X(j)+'" y="'+(H-8)+'" text-anchor="middle" style="fill:var(--muted);font-size:11px">'+esc(l)+'</text>'});
  const ns=o.series.length;
  if(o.type==='bar'){
    const bw=Math.min(24,band*.7);
    for(let j=0;j<n;j++){
      if(stacked){let p=0,q=0;
        o.series.forEach(sr=>{const v=sr.data[j]||0;if(!v)return;const a=v>=0?p:q,b=a+v;if(v>=0)p=b;else q=b;
          const yt=Math.min(Y(a),Y(b)),hh=Math.max(1,Math.abs(Y(a)-Y(b))-1);
          s+='<rect x="'+(X(j)-bw/2)+'" y="'+yt+'" width="'+bw+'" height="'+hh+'" rx="2" fill="'+(o.single?(v>=o.base?'var(--pos)':'var(--neg)'):sr.color)+'" data-j="'+j+'"/>'})}
      else{const gw=Math.min(bw/ns,14);
        o.series.forEach((sr,k)=>{const v=sr.data[j];if(v===null||v===undefined)return;
          const x=X(j)-gw*ns/2+gw*k,yt=Math.min(Y(v),Y(o.base)),hh=Math.max(1,Math.abs(Y(v)-Y(o.base)));
          s+='<rect x="'+x+'" y="'+yt+'" width="'+Math.max(2,gw-1)+'" height="'+hh+'" rx="2" fill="'+(o.single?(v>=o.base?'var(--pos)':'var(--neg)'):sr.color)+'"/>'})}
    }
  }else{
    o.series.forEach(sr=>{let d='',pen=false;
      sr.data.forEach((v,j)=>{if(v===null||v===undefined){pen=false;return}d+=(pen?'L':'M')+X(j)+' '+Y(v);pen=true});
      s+='<path d="'+d+'" fill="none" stroke="'+sr.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      for(let j=n-1;j>=0;j--){const v=sr.data[j];if(v!==null&&v!==undefined){s+='<circle cx="'+X(j)+'" cy="'+Y(v)+'" r="4" fill="'+sr.color+'" style="stroke:var(--card)" stroke-width="2"/>';break}}});
  }
  s+='<line id="'+el.id+'g" y1="'+mt+'" y2="'+(mt+ph)+'" style="stroke:var(--axis)" stroke-width="1" visibility="hidden"/>';
  s+='<rect x="'+ml+'" y="'+mt+'" width="'+pw+'" height="'+ph+'" fill="transparent" id="'+el.id+'h"/></svg><div class="tip" id="'+el.id+'t"></div>';
  el.innerHTML=s;
  const tip=$(el.id+'t'),guide=$(el.id+'g'),hit=$(el.id+'h');
  const move=ev=>{const r=hit.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*pw;
    let j=o.type==='bar'?Math.floor(px/band):Math.round(px/(pw/Math.max(1,n-1)));j=Math.max(0,Math.min(n-1,j));
    guide.setAttribute('x1',X(j));guide.setAttribute('x2',X(j));guide.setAttribute('visibility',o.type==='bar'?'hidden':'visible');
    tip.innerHTML=o.tip(j);tip.style.display='block';
    const cw=el.clientWidth,tw=tip.offsetWidth,sx=X(j)/W*cw;
    tip.style.left=Math.max(0,Math.min(cw-tw,sx+12>cw-tw?sx-tw-12:sx+12))+'px';tip.style.top='6px'};
  hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{tip.style.display='none';guide.setAttribute('visibility','hidden')});
}

function update(){
  saveState();
  const by=$('by').value,met=$('met').value,gran=$('gran').value;
  let from=$('from').value||MIND,to=$('to').value||MAXD;
  const rows=R.filter(x=>on.v.has(x.v)&&on.b.has(x.b)&&x.d>=from&&x.d<=to);
  const key=d=>gran==='w'?wk(d):d;

  const tot=agg(()=>true);
  const T=rows.reduce((a,x)=>({i:a.i+x.i,r:a.r+x.r,n:a.n+x.n,h:a.h+x.h,u:a.u+x.u}),{i:0,r:0,n:0,h:0,u:0});
  $('sub').textContent='データ: '+MIND.replace(/-/g,'/')+' 〜 '+MAXD.replace(/-/g,'/')+'（'+new Set(R.map(x=>x.d)).size+'日ぶん）　作成: '+D.generated+(T.u?'　※結果未確定の買い目 '+T.u+'件を含む（払戻0円で計算）':'');
  const pl=T.r-T.i;
  $('kpi').innerHTML=[['累計収支',yen(pl),pl<0?'neg':''],['回収率',T.i?pct(T.r/T.i*100):'-',''],['投資額',yen(T.i),''],['的中率（買い目×レース単位）',T.n?pct(T.h/T.n*100):'-','']]
    .map(a=>'<div class="k"><div class="l">'+a[0]+'</div><div class="v '+a[2]+'">'+a[1]+'</div></div>').join('');
  const mname={pl:'収支',roi:'回収率',inv:'投資額'}[met],bname={all:'全体',v:'馬場別',b:'券種別'}[by];
  const base=met==='roi'?100:0,fy=v=>met==='roi'?v+'%':yen(v);
  let ser=[];
  if(by==='all')ser=[{n:'合計',c:'#2a78d6',f:()=>true}];
  if(by==='v')ser=VS.filter(k=>on.v.has(k)).map(k=>({n:vn(k),c:vc(k),f:x=>x.v===k}));
  if(by==='b')ser=BS.filter(k=>on.b.has(k)).map(k=>({n:k,c:bc(k),f:x=>x.b===k}));
  const aggs=ser.map(s=>agg(s.f));
  $('t1').textContent=(gran==='w'?'週ごと':'当日（1日ごと）')+'の'+mname+'（'+bname+'）';
  const stackedOK=met!=='roi';
  const barSeries=ser.map((s,idx)=>({name:s.n,color:s.c,data:per.map(k=>val(met,aggs[idx][k].i,aggs[idx][k].r))}));
  $('lg1').innerHTML=by==='all'?'<span><i style="background:var(--pos)"></i>プラス</span><span><i style="background:var(--neg)"></i>マイナス</span>':ser.map(s=>'<span><i style="background:'+s.c+'"></i>'+esc(s.n)+'</span>').join('')+(stackedOK?'<span style="color:var(--muted)">（積み上げ。0より上が黒字側）</span>':'<span style="color:var(--muted)">（回収率は並べて表示）</span>');
  draw({el:$('c1'),type:'bar',h:210,labels,series:barSeries,base,stacked:stackedOK&&by!=='all'?true:(by==='all'),single:by==='all',fy,aria:'期間ごとの'+mname+'の棒グラフ',
    tip:j=>{let h='<b>'+esc(labels[j])+'</b>';
      if(by!=='all')barSeries.forEach(s=>{const v=s.data[j];if(v===null||v===undefined||(met!=='roi'&&!v))return;h+='<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+s.color+'"></i> '+esc(s.name)+' '+fmt(met,v)+'</div>'});
      const t=tot[per[j]];h+='<div style="margin-top:3px;padding-top:3px;border-top:1px solid var(--line)">合計 '+fmt(met,val(met,t.i,t.r))+'（投資 '+yen(t.i)+'）</div>';return h}});
  $('t2').textContent='累計の'+mname+'（'+bname+'）';
  const lineSeries=ser.map((s,idx)=>{let ci=0,cr=0;return{name:s.n,color:s.c,data:per.map(k=>{ci+=aggs[idx][k].i;cr+=aggs[idx][k].r;return val(met,ci,cr)})}});
  $('lg2').innerHTML=lineSeries.map(s=>{let l=null;for(let j=s.data.length-1;j>=0;j--){if(s.data[j]!==null){l=s.data[j];break}}return '<span><i style="background:'+s.color+'"></i>'+esc(s.name)+' '+fmt(met,l)+'</span>'}).join('')+'<span style="color:var(--muted)">（点線は'+(met==='roi'?'100%':'0円')+'）</span>';
  draw({el:$('c2'),type:'line',h:260,labels,series:lineSeries,base,fy,aria:'累計の'+mname+'の折れ線グラフ',
    tip:j=>'<b>'+esc(labels[j])+'</b>'+lineSeries.map(s=>'<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+s.color+'"></i> '+esc(s.name)+' '+fmt(met,s.data[j])+'</div>').join('')});
  // ヒートマップ
  const bsel=BS.filter(k=>on.b.has(k));
  let h='<tr><th></th>'+bsel.map(k=>'<th style="text-align:center">'+esc(k)+'</th>').join('')+'<th style="text-align:center">計</th></tr>';
  const cell=(i,r)=>{if(!i)return '<td style="color:var(--muted)">-</td>';const roi=r/i*100,t=Math.max(-1,Math.min(1,(roi-100)/100)),bg=t>=0?'rgba(42,120,214,'+(t*.55)+')':'rgba(227,73,72,'+(-t*.55)+')';return '<td style="background:'+bg+'">'+Math.round(roi)+'%<small>'+Math.round(i).toLocaleString()+'</small></td>'};
  VS.filter(k=>on.v.has(k)).forEach(v=>{
    h+='<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+vc(v)+';margin-right:6px"></i>'+esc(vn(v))+'</td>';
    let ti=0,tr=0;bsel.forEach(b=>{const q=rows.filter(x=>x.v===v&&x.b===b).reduce((a,x)=>({i:a.i+x.i,r:a.r+x.r}),{i:0,r:0});ti+=q.i;tr+=q.r;h+=cell(q.i,q.r)});
    h+=cell(ti,tr)+'</tr>'});

    per.map(k=>{const t=tot[k],p=t.r-t.i;return '<tr><td>'+k.replace(/-/g,'/')+'</td><td>'+t.n+'</td><td>'+t.h+'</td><td>'+yen(t.i)+'</td><td>'+yen(t.r)+'</td><td class="'+(p<0?'neg':'')+'">'+yen(p)+'</td><td>'+(t.i?pct(t.r/t.i*100):'-')+'</td></tr>'}).join('');
  $('tordl').style.display=$('tv').value==='race'?'':'none';
  if($('tv').value==='race'){
    // レースごとの明細（2026-11-20追加）: 日付×場×レースで、選択中の馬場・券種・期間の支出/収入/収支と、その日の損益・累計収支
    const g=new Map();
    RR.filter(x=>on.v.has(x.v)&&on.b.has(x.b)&&x.d>=from&&x.d<=to).forEach(x=>{
      const k=x.d+'|'+x.t+'|'+x.v+'|'+x.n;let a=g.get(k);
      if(!a){a={d:x.d,t:x.t,v:x.v,n:x.n,i:0,r:0,bt:{},unc:false};g.set(k,a)}
      a.i+=x.i;a.r+=x.r;a.bt[x.b]=(a.bt[x.b]||0)+1;if(!x.c)a.unc=true});
    const tk=a=>a.t||'99:99';
    const list=[...g.values()].sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:tk(p)<tk(q)?-1:tk(p)>tk(q)?1:p.v<q.v?-1:p.v>q.v?1:p.n-q.n);

    let h='<tr><th>日付</th><th>馬場</th><th>R</th><th>発走</th><th style="text-align:left">買い目（券種）</th><th>支出</th><th>収入</th><th>収支</th><th>当日累計<br><span class="sm">（その日の最初から）</span></th><th>期間累計<br><span class="sm">（期間の最初から）</span></th><th style="text-align:left">1〜3着の単勝オッズ<br><span class="sm">（馬番 オッズ・人気）</span></th></tr>';
    out.forEach(day=>{
      if(newFirst)h+=dayRow(day);
      day.rows.forEach(a=>{
        h+='<tr><td>'+day.d.replace(/-/g,'/')+'</td><td>'+esc(vn(a.v))+'</td><td>'+a.n+'R</td><td>'+esc(a.t||'-')+'</td><td style="text-align:left">'+Object.keys(a.bt).sort(bord).map(esc).join('・')+'</td><td>'+yen(a.i)+'</td><td>'+(a.unc?'<span class="sm">未確定</span>':a.r>0?'<span class="pos">'+yen(a.r)+'</span>':yen(a.r))+'</td><td>'+(a.unc?'<span class="sm">-</span>':sg(a.r-a.i))+'</td><td>'+sg(a.dcum)+'</td><td>'+sg(a.cum)+'</td><td style="text-align:left;white-space:nowrap">'+finHtml(a)+'</td></tr>'});
      if(!newFirst)h+=dayRow(day)});
    $('tbl').innerHTML=list.length?h:'<tr><td>この条件に該当するデータがありません。</td></tr>';
    $('tnote').textContent='当日累計は、その日の最初のレースからの合計です。期間累計は、上の絞り込み（馬場・券種・期間）の範囲の最初のレースから通した合計です。1〜3着の単勝オッズは確定オッズです。1レースの支出・収入は選択中の券種の合計で、結果未確定の買い目は収入0円で計算するため「未確定」と表示します。';
  }else{
    $('tbl').innerHTML=perTbl;$('tnote').textContent='';

}
function setRange(){const v=$('rng').value;if(v==='x')return;
  $('to').value=MAXD;$('from').value=v==='0'?MIND:addDays(MAXD,-(+v)+1)}
chips('cv',VS,vn,vc,on.v);chips('cb',BS,k=>k,bc,on.b);
